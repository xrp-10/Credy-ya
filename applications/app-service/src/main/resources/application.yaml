server:
  port: 8080
spring:
  application:
    name: "CrediYa"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  sql:
    init:
      mode: "always"
      encoding: "UTF-8"
adapters:
  r2dbc:
    host: "${DB_HOST:localhost}"
    port: ${DB_PORT:5432}
    database: "${DB_NAME:crediya}"
    schema: "${DB_SCHEMA:public}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:}"
