server:
  port: 8080
spring:
  application:
    name: "CrediYa"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  sql:
    init:
      mode: "always"
      encoding: "UTF-8"
adapters:
  r2dbc:
    host: "${DB_HOST:localhost}"
    port: ${DB_PORT:5432}
    database: "${DB_NAME:crediya}"
    schema: "${DB_SCHEMA:public}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
security:
  jwt:
    secret: "${JWT_SECRET:}"
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
springdoc:
  swagger-ui:
    path: "/swagger-ui.html"
    persist-authorization: true
    operations-sorter: "alpha"
    tags-sorter: "alpha"
